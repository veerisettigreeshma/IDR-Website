<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">

  <defs>

    <!-- Orange gradient for the top face of the cube -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B1A;" />
      <stop offset="100%" style="stop-color:#E04A00;" />
    </linearGradient>

    <!-- Dark gradient for the left face -->
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A1A1A;" />
      <stop offset="100%" style="stop-color:#333333;" />
    </linearGradient>

    <!-- Light orange gradient for the right face -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B1A; stop-opacity:0.75" />
      <stop offset="100%" style="stop-color:#FF9A5C; stop-opacity:0.95" />
    </linearGradient>

  </defs>

  <!-- TOP face of the cube -->
  <polygon points="40,8 68,24 40,40 12,24" fill="url(#topFace)" />

  <!-- LEFT face of the cube -->
  <polygon points="12,24 40,40 40,68 12,52" fill="url(#leftFace)" />

  <!-- RIGHT face of the cube -->
  <polygon points="40,40 68,24 68,52 40,68" fill="url(#rightFace)" />

  <!-- Small inner highlight on top face (suggests depth / structure) -->
  <polygon points="40,20 52,27 40,34 28,27" fill="white" opacity="0.2" />

  <!-- Vertical edge line on the front of the cube -->
  <line x1="40" y1="40" x2="40" y2="68" stroke="white" stroke-width="1" opacity="0.25" />

</svg>